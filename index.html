<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo para tu gato</title>
    <!--- 1. Bootstrap CSS (CDN) --->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--- 2. CSS Local --->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--- 2. Navbar de Bootstrap --->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <!--- Título de la navbar --->
            <a class="navbar-brand" href="#">Tienda Felina</a>

            <!--- Menú Hamburguesa --->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Juguetes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 3. Estructura principal para usar CSS Grid -->
    <div class="grid-container">
        <main class="contenido-principal">
            <h1 class="mt-4">Bienvenido a la Tienda Felina</h1>

            <!-- 4. Sección de productos usando Flexbox -->
            <section class="productos-flex">
                <div class="tarjeta-producto">
                    <h3>🐈 Rascador Gigante</h3>
                    <p>No se lo merece.</p>
                </div>
                <div class="tarjeta-producto">
                    <h3>🐁 Galletas con Catnip</h3>
                    <p>Para la locura.</p>
                </div>
                <div class="tarjeta-producto">
                    <h3>🐟 Churu </h3>
                    <p>Lo mejor en sabor.</p>
                </div>
            </section>
        </main>

        <!-- Barra Lateral -->
        <aside class="barra-lateral">
            <h2>Consejos</h2>
            <p>Compre harto</p>
        </aside>

    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
